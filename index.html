<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kem Parkour">
  <meta name="theme-color" content="#1d1d24">
  <title>Kem Parkour</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
  <link rel="preload" href="assets/fonts/sedgwick-ave-display-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Letra de grafite do logo (licença OFL: assets/fonts/OFL.txt). Fica no
       próprio jogo, sem depender da internet, pra funcionar offline no iPhone. */
    @font-face {
      font-family: 'Sedgwick Ave Display';
      src: url('assets/fonts/sedgwick-ave-display-latin.woff2') format('woff2');
      font-display: block;
    }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #10131a;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    /* O jogo ocupa a tela toda MENOS as áreas protegidas do iPhone (Dynamic
       Island, cantos arredondados, barrinha de baixo). Sem isso, nos iPhones
       mais novos parte da tela ficava embaixo da ilha. */
    #game {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
    }
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 10; background: #10131a; color: #fff;
      font: 700 22px system-ui, sans-serif; align-items: center; justify-content: center; text-align: center;
    }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate">📱↻<br>Gire o celular para jogar</div>
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
  <script>
    // O service worker só entra fora do laço de desenvolvimento (localhost
    // e testes no Wi-Fi de casa), pra nunca prender o Arthur numa versão
    // velha do jogo enquanto a gente ainda está mexendo nele.
    if ('serviceWorker' in navigator) {
      var h = location.hostname;
      var isDev = h === 'localhost' || h === '127.0.0.1' || h === ''
        || /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h);
      if (!isDev) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    }
  </script>
</body>
</html>
